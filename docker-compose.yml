services:
  paladin:
    build: .
    container_name: paladin
    volumes:
      - ./config.toml:/app/config.toml
      - ${REPOS_DIR}:${CLONE_BASE_DIR}
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    depends_on:
      - mongo
    environment:
      - WORKERS=${WORKERS}
      - PORT=${CONTAINER_PORT}
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: paladin-mongo
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
