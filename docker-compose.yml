services:
  paladin:
    build: .
    container_name: paladin
    volumes:
      - ./config.toml:/app/config.toml
      - ${CLONE_BASE_DIR}:${CLONE_BASE_DIR}
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    environment:
      - WORKERS=${WORKERS}
      - PORT=${CONTAINER_PORT}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - CLAUDE_BRIDGE_URL=http://host.docker.internal:${CLAUDE_BRIDGE_PORT}
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: paladin-mongo
    profiles:
      - mongo
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
