[project]
name = "Paladin"
version = "0.1.0"
description = "Runs semgrep and provides a web-ui to view results"
authors = [
    {name = "Anuraag Baishya",email = "baishya.anuraag1920@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "flask (==3.1.2)",
    "gitpython (==3.1.45)",
    "pymongo (==4.14.1)",
    "tomli (>=2.2.1,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "google-genai (>=1.39.1,<2.0.0)",
    "cpgqls-client (>=0.0.9,<0.0.10)",
    "pygount (>=3.1.0,<4.0.0)",
    "pysarif (>=0.1.0,<0.2.0)",
    "gunicorn (>=25.0.3,<26.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
